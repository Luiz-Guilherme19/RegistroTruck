<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#51504F">
<title>Minhas Entregas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🚚 Minhas Entregas</h1><div class="sub" id="data"></div></div>
  </header>
  <div class="tabs">
    <button class="tab on" id="t1">Entregas</button>
    <button class="tab" id="t2">Adicionar</button>
  </div>

  <section id="lista"></section>

  <section id="novo" class="hide">
    <form id="f">
      <label for="n">Cliente / entrega</label>
      <input id="n" required placeholder="Ex.: Mercado Central">
      <label for="e">Endereço</label>
      <input id="e" required placeholder="Rua, número, bairro, cidade">
      <button class="save" type="submit">Salvar entrega</button>
    </form>
  </section>
</div>
<button class="fab" id="fab" aria-label="Adicionar entrega">+</button>

<script src="script.js"></script>
</body>
</html>
