<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#51504F">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("tema")||"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<title>Minhas Entregas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<link rel="icon" type="image/png" href="image/Icon.png">
<body>
<div class="wrap">
  <header>
    <div><h1>🚚 Minhas Entregas</h1><div class="sub" id="data"></div></div>
    <div class="hbtns">
      <button class="ref" id="tema" aria-label="Alternar entre modo claro e escuro" title="Modo claro / escuro"><svg class="ic-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="ref" id="ref" aria-label="Atualizar distâncias" title="Atualizar distâncias"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </header>
  <div class="tabs">
    <button class="tab on" id="t1">Entregas</button>
    <button class="tab" id="t2">Adicionar</button>
    <button class="tab" id="t3">🛣 Viagem</button>
  </div>

  <div id="aviso" class="aviso hide"></div>

  <section id="lista"></section>

  <section id="novo" class="hide">
    <form id="f">
      <label for="n">Cliente / entrega</label>
      <input id="n" required placeholder="Ex.: Mercado Central">
      <label for="e">Endereço</label>
      <div class="campo">
        <input id="e" required placeholder="Rua, número, bairro, cidade">
        <button type="button" class="mic" id="mic" aria-label="Falar o endereço" title="Falar o endereço"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>
      </div>
      <div class="vs" id="vs"></div>
      <button class="save" type="submit">Salvar entrega</button>
    </form>
  </section>

  <section id="viagem" class="hide">
    <div class="painel">
      <div class="vtop"><span class="vst" id="vst">Parada</span></div>
      <div class="bigkm"><span id="vkm">0,0</span><small>km</small></div>
      <div class="grid3">
        <div><b id="vtempo">00:00:00</b><span>em movimento</span></div>
        <div><b id="vlit">—</b><span>combustível</span></div>
        <div><b id="vvel">—</b><span>média km/h</span></div>
      </div>
      <div class="vcalc" id="vcalc"></div>
      <button class="vmain go" id="vmain">▶ Iniciar viagem</button>
      <button class="vfim hide" id="vfim">■ Finalizar</button>
      <div class="vdica" id="vgps"></div>
      <div class="vult hide" id="vult"></div>
    </div>

    <div class="painel">
      <h2>🚛 Caminhão e consumo</h2>
      <label for="vmod">Modelo do caminhão</label>
      <input id="vmod" list="vmods" placeholder="Ex.: Scania R 450" autocomplete="off">
      <datalist id="vmods">
        <option value="Scania R 450"><option value="Scania R 540"><option value="Volvo FH 540"><option value="Volvo FH 460">
        <option value="Mercedes-Benz Actros 2651"><option value="Mercedes-Benz Atego 2430"><option value="Mercedes-Benz Accelo 1016">
        <option value="Volkswagen Constellation 24.280"><option value="Volkswagen Delivery 11.180"><option value="Iveco S-Way 480">
        <option value="Iveco Daily 70C16"><option value="DAF XF 530"><option value="Ford Cargo 2429"><option value="Hyundai HR">
      </datalist>
      <button class="busca" id="vbusca" type="button">🔎 Pesquisar consumo do modelo na internet</button>
      <div class="vres hide" id="vres"></div>

      <label for="vkmpl" class="sep">Consumo (km por litro)</label>
      <input id="vkmpl" inputmode="decimal" placeholder="Ex.: 2,5" autocomplete="off">
      <label for="vcat">Ou escolha uma categoria (média estimada)</label>
      <select id="vcat">
        <option value="">Selecionar…</option>
        <option value="2.5">Carreta / cavalo mecânico · ≈ 2,5 km/L</option>
        <option value="3">Truck / caminhão pesado · ≈ 3,0 km/L</option>
        <option value="5.5">Toco / 3/4 · ≈ 5,5 km/L</option>
        <option value="8">VUC / leve · ≈ 8,0 km/L</option>
      </select>

    </div>
  </section>
</div>
<button class="fab" id="fab" aria-label="Adicionar entrega">+</button>

<script src="js/script.js"></script>
<script src="js/viagem.js"></script>
</body>
</html>
